# leetvim
[solution]
lang = "cpp"
workspace = "~/leet code"
filename = "{lang}/{id}.{slug}.{ext}"

[solution.inject_before]
cpp = """
#include <vector>
using namespace std;
"""

[editor]
command = 'nvim -u NONE'

[keys]
prefix = "ctrl-a" # tmux habit
run = "f5"

[ui]
split = 0.42
theme = "tokyo-night"
mouse = true
